name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    env:
      PANDOC_VERSION: 3.9.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            rustTarget: 'aarch64-apple-darwin'
            pandocAsset: 'pandoc-3.9.0.2-arm64-macOS.zip'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            rustTarget: 'x86_64-apple-darwin'
            pandocAsset: 'pandoc-3.9.0.2-x86_64-macOS.zip'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
            rustTarget: 'x86_64-unknown-linux-gnu'
            pandocAsset: 'pandoc-3.9.0.2-linux-amd64.tar.gz'
          - platform: 'windows-latest'
            args: ''
            target: ''
            rustTarget: 'x86_64-pc-windows-msvc'
            pandocAsset: 'pandoc-3.9.0.2-windows-x86_64.zip'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync app version from git tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = String(process.env.VERSION || '').replace(/^v/i, '').trim();
          if (!version) {
            throw new Error('VERSION env is empty');
          }
          console.log('Release version:', version);

          const pkgPath = 'package.json';
          const tauriPath = 'src-tauri/tauri.conf.json';
          const cargoPath = 'src-tauri/Cargo.toml';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          tauri.bundle = tauri.bundle || {};
          const existingExternalBin = Array.isArray(tauri.bundle.externalBin)
            ? tauri.bundle.externalBin
            : [];
          const existingResources = Array.isArray(tauri.bundle.resources)
            ? tauri.bundle.resources
            : [];
          tauri.bundle.externalBin = Array.from(new Set([
            ...existingExternalBin,
            'binaries/pandoc'
          ]));
          tauri.bundle.resources = Array.from(new Set([
            ...existingResources,
            'resources/reference.docx'
          ]));
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const cargoBefore = fs.readFileSync(cargoPath, 'utf8');
          const cargoAfter = cargoBefore.replace(
            /^version\s*=\s*"[^"]+"/m,
            `version = "${version}"`
          );
          if (cargoBefore === cargoAfter) {
            throw new Error('Failed to update version in src-tauri/Cargo.toml');
          }
          fs.writeFileSync(cargoPath, cargoAfter);
          NODE
        env:
          VERSION: ${{ github.ref_name }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm install -g bun
          bun install

      - name: Download bundled Pandoc (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TMP_DIR="$(mktemp -d)"
          ARCHIVE_PATH="$TMP_DIR/${{ matrix.pandocAsset }}"
          EXTRACT_DIR="$TMP_DIR/extract"
          curl -L "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${{ matrix.pandocAsset }}" -o "$ARCHIVE_PATH"
          mkdir -p "$EXTRACT_DIR"
          case "${{ matrix.pandocAsset }}" in
            *.zip)
              unzip -q "$ARCHIVE_PATH" -d "$EXTRACT_DIR"
              ;;
            *.tar.gz)
              tar -xzf "$ARCHIVE_PATH" -C "$EXTRACT_DIR"
              ;;
            *)
              echo "Unsupported Pandoc archive: ${{ matrix.pandocAsset }}"
              exit 1
              ;;
          esac
          PANDOC_BIN="$(find "$EXTRACT_DIR" -type f -name pandoc | head -n 1)"
          if [ -z "$PANDOC_BIN" ]; then
            echo "Failed to locate extracted pandoc binary"
            exit 1
          fi
          cp "$PANDOC_BIN" "src-tauri/binaries/pandoc-${{ matrix.rustTarget }}"
          chmod +x "src-tauri/binaries/pandoc-${{ matrix.rustTarget }}"

      - name: Build Word reference template (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          "src-tauri/binaries/pandoc-${{ matrix.rustTarget }}" \
            -o "src-tauri/resources/reference.docx" \
            --print-default-data-file reference.docx
          python3 scripts/prepare_reference_docx.py "src-tauri/resources/reference.docx"

      - name: Download bundled Pandoc (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $tempDir = Join-Path $env:RUNNER_TEMP "pandoc-sidecar"
          if (Test-Path $tempDir) {
            Remove-Item $tempDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force $tempDir | Out-Null
          $archivePath = Join-Path $tempDir "${{ matrix.pandocAsset }}"
          $extractDir = Join-Path $tempDir "extract"
          Invoke-WebRequest "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/${{ matrix.pandocAsset }}" -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force
          $pandoc = Get-ChildItem -Path $extractDir -Recurse -Filter pandoc.exe | Select-Object -First 1
          if (-not $pandoc) {
            throw "Failed to locate extracted pandoc.exe"
          }
          Copy-Item $pandoc.FullName "src-tauri/binaries/pandoc-${{ matrix.rustTarget }}.exe"

      - name: Build Word reference template (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          & "src-tauri/binaries/pandoc-${{ matrix.rustTarget }}.exe" `
            -o "src-tauri/resources/reference.docx" `
            --print-default-data-file reference.docx
          python scripts/prepare_reference_docx.py "src-tauri/resources/reference.docx"

      - name: Verify bundled Pandoc (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          ls -la src-tauri/binaries

      - name: Verify bundled Pandoc (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/binaries

      - name: Verify Word export resources (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          ls -la src-tauri/resources

      - name: Verify Word export resources (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/resources

      - name: Use repository icon assets
        run: |
          test -f src-tauri/icons/32x32.png
          test -f src-tauri/icons/128x128.png
          test -f src-tauri/icons/128x128@2x.png
          test -f src-tauri/icons/icon.icns
          test -f src-tauri/icons/icon.ico

      - name: Verify icons (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          echo "=== Icons directory ==="
          ls -la src-tauri/icons/
          echo ""
          echo "=== Verifying ICO ==="
          cat src-tauri/icons/icon.ico | head -c 6 | xxd

      - name: Verify icons (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Icons directory ==="
          Get-ChildItem src-tauri/icons
          Write-Host ""
          Write-Host "=== Verifying ICO ==="
          Get-Item src-tauri/icons/icon.ico | Format-List Length, Name, FullName

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PerfectMD ${{ github.ref_name }}'
          releaseBody: |
            ## 下载安装
            - macOS M1/M2/M3: 下载 `_aarch64.dmg`
            - macOS Intel: 下载 `_x64.dmg`
            - Windows: 下载 `.msi`
            - Linux: 下载 `.deb` 或 `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
