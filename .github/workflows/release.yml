name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync app version from git tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = String(process.env.VERSION || '').replace(/^v/i, '').trim();
          if (!version) {
            throw new Error('VERSION env is empty');
          }
          console.log('Release version:', version);

          const pkgPath = 'package.json';
          const tauriPath = 'src-tauri/tauri.conf.json';
          const cargoPath = 'src-tauri/Cargo.toml';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const cargoBefore = fs.readFileSync(cargoPath, 'utf8');
          const cargoAfter = cargoBefore.replace(
            /^version\s*=\s*"[^"]+"/m,
            `version = "${version}"`
          );
          if (cargoBefore === cargoAfter) {
            throw new Error('Failed to update version in src-tauri/Cargo.toml');
          }
          fs.writeFileSync(cargoPath, cargoAfter);
          NODE
        env:
          VERSION: ${{ github.ref_name }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm install -g bun
          bun install

      - name: Use repository icon assets
        run: |
          test -f src-tauri/icons/32x32.png
          test -f src-tauri/icons/128x128.png
          test -f src-tauri/icons/128x128@2x.png
          test -f src-tauri/icons/icon.icns
          test -f src-tauri/icons/icon.ico

      - name: Verify icons (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          echo "=== Icons directory ==="
          ls -la src-tauri/icons/
          echo ""
          echo "=== Verifying ICO ==="
          cat src-tauri/icons/icon.ico | head -c 6 | xxd

      - name: Verify icons (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Icons directory ==="
          Get-ChildItem src-tauri/icons
          Write-Host ""
          Write-Host "=== Verifying ICO ==="
          Get-Item src-tauri/icons/icon.ico | Format-List Length, Name, FullName

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PerfectMD ${{ github.ref_name }}'
          releaseBody: |
            ## 下载安装
            - macOS M1/M2/M3: 下载 `_aarch64.dmg`
            - macOS Intel: 下载 `_x64.dmg`
            - Windows: 下载 `.msi`
            - Linux: 下载 `.deb` 或 `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
